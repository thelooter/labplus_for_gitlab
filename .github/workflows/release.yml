name: Release

# Fires once per published release (covers prereleases too, which emit
# `published` as well). The previous version also triggered on `edited`, so
# fixing a typo in the release notes re-ran the entire signing pipeline.
on:
  release:
    types:
      - published
  # Lets the build path be exercised without cutting a real release. With
  # `publish` false the APKs are built, signed and uploaded as workflow
  # artifacts, but nothing is attached to any release.
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the built APKs to an existing release"
        type: boolean
        default: false
      tag:
        description: "Release tag to attach to (only used when publish is true)"
        type: string
        required: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.24.1"

jobs:
  build:
    name: Build signed APKs
    runs-on: ubuntu-latest
    # This job holds the keystore. It deliberately does not get `contents:
    # write` -- attaching assets is the `publish` job's business.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing here needs authenticated git, and leaving GITHUB_TOKEN in
          # .git/config would expose it to every later step -- including the
          # ones handling signing material.
          persist-credentials: false

      # The version shipped to users comes from pubspec.yaml, which the
      # maintainer bumps by hand when cutting a release. The old workflow tried
      # to rewrite it with `sed s/99.99.99+99/.../`, but that sentinel has not
      # existed in pubspec.yaml for years, so the substitution silently matched
      # nothing and every build would have shipped the stale version anyway.
      #
      # Rather than reintroduce the sentinel, this fails loudly on a mismatch.
      # Keeping the build number under human control matters: Android requires
      # versionCode to increase monotonically, and deriving it from
      # github.run_number would have restarted at 1 and broken upgrades.
      - name: Verify tag matches pubspec version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          pubspec_version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          tag_version="${TAG#v}"
          if [ "$pubspec_version" != "$tag_version" ]; then
            echo "::error::Tag '$tag_version' does not match pubspec.yaml version '$pubspec_version'. Bump pubspec.yaml (including the +buildNumber) and retag before releasing."
            exit 1
          fi
          echo "Version $pubspec_version matches tag $TAG."

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Decoded inline rather than via a third-party action: this is one
      # `base64 -d` and the keystore is the most sensitive thing in the repo,
      # so it should pass through as few third parties as possible.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      # Secrets go through env rather than ${{ }} interpolation into the shell
      # body, so a value containing shell metacharacters cannot break out.
      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          {
            echo "storeFile=$RUNNER_TEMP/keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      # --flavor signed is mandatory. android/app/build.gradle declares the
      # `fdroid` and `signed` product flavors, so a bare `flutter build` compiles
      # and *then* fails with "Gradle build failed to produce an .apk file"
      # because it looks at the unflavored output path. `signed` is the flavor
      # carrying signingConfigs.release; `fdroid` (used by CI in flutter.yml)
      # has none. Same trap that was fixed for flutter.yml in f9e0caa.
      #
      # Two builds: the universal APK and the per-ABI splits. --split-per-abi
      # emits only the splits, so the fat APK needs its own pass. Both are what
      # past releases actually shipped; the old workflow built an .aab for a
      # Play Store listing that does not exist -- this app ships via F-Droid and
      # GitHub Releases.
      - name: Build universal APK
        run: flutter build apk --release --flavor signed --no-tree-shake-icons

      - name: Build split APKs
        run: flutter build apk --release --flavor signed --split-per-abi --no-tree-shake-icons

      # Flutter's Gradle wrapper already writes a .sha1 next to each APK, and
      # those are exactly the checksum files attached to previous releases
      # (verified byte-for-byte against 1.5.0: same value, no trailing newline).
      # Copying them rather than regenerating keeps the assets identical to
      # what the manual process produced.
      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          for abi in signed arm64-v8a-signed armeabi-v7a-signed x86_64-signed; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" dist/
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk.sha1" dist/
          done
          ls -l dist

      # Runs even if a build step failed, so signing material never outlives
      # the job that needs it. The runner is ephemeral, but the artifact upload
      # below reads from the workspace.
      - name: Remove signing material
        if: always()
        run: shred -u android/key.properties "$RUNNER_TEMP/keystore.jks" || true

      - name: Upload APKs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-apks
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach APKs to release
    runs-on: ubuntu-latest
    needs: build
    # Skipped on a dry-run workflow_dispatch, which is the whole point of the
    # dispatch trigger: exercise the build without touching a release.
    if: github.event_name == 'release' || inputs.publish
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-apks
          path: dist

      # The old workflow never did this. Even on a fully green run it would
      # have produced a release with no assets attached.
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::No tag to publish to. Pass the 'tag' input when running with publish enabled."
            exit 1
          fi
          gh release upload "$TAG" dist/* --clobber
